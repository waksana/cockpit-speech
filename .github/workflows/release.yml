name: Rolling
# This workflow path/name and its run_number are the permanent sequence authority.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: read

# No concurrency group: even cancel-in-progress:false may discard pending runs.
jobs:
  build:
    # Closed + merged only: never execute unmerged fork code with a privileged token.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck && pnpm test
      - run: node scripts/rolling.mjs prepare
      - run: pnpm build && pnpm package && node scripts/rolling.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rolling-${{ github.run_number }}
          path: module-output/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rolling-${{ github.run_number }}
          path: release-artifact
      - run: node scripts/rolling.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
