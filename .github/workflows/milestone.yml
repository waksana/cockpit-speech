name: Milestone
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing successful Rolling tag to promote
        type: string
        required: true
      confirmation:
        description: Repeat that exact tag to confirm in-place promotion to Latest
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - name: Validate selection before checkout
        env:
          TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$TAG" =~ ^v0\.0\.0-rolling\.[1-9][0-9]*$ ]]
          test "$TAG" = "$CONFIRMATION"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@waksana'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: node scripts/promote-milestone.mjs
        env:
          GH_TOKEN: ${{ github.token }}
